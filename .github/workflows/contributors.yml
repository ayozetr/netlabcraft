name: Contributors

# Regenerates contributors/contributors.json from the git history (`cargo xtask contributors`) and
# uploads it as an artifact, so the About ▸ Contributors window can be refreshed before a release
# without building anything on a developer's computer. Run it by hand (workflow_dispatch) on `main`,
# download the artifact, copy the file over contributors/contributors.json and open a pull request.
# It is not a gate: the `gate` job in ci.yml stays the required check.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The statistics count every commit, so the whole history is needed.
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Regenerate contributors.json
        run: cargo xtask contributors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributors
          path: contributors/contributors.json
          if-no-files-found: error
          retention-days: 14

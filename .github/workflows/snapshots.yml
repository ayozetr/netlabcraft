name: Snapshots

# Renders the code-drawn art (device icons, cable tiles, the wiring closet, the logical workspace) to
# PNGs and uploads them as an artifact, so UI work can be looked at without running the app. It is
# not a gate: the `gate` job in ci.yml stays the required check. Run it by hand (workflow_dispatch),
# by labelling a pull request `snapshots`, or by pushing a branch named `visual/*`.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: ['visual/**']

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sheets:
    # On a pull request only when it carries the `snapshots` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'snapshots')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software Vulkan driver
        # The runner has no GPU; wgpu falls back to lavapipe, which renders offscreen with no display.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Render the sheets
        run: cargo run --release -p netlabcraft-ui-egui --example sheets -- sheets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: sheets/*.png
          if-no-files-found: error
          retention-days: 14

  readme:
    # The seven README screenshots (docs/images), rendered with the offscreen `snapshot` example.
    # Not run on pull requests; start it by hand or from a `visual/*` branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the snapshot example
        run: cargo build --release -p netlabcraft-ui-egui --example snapshot
      - name: Render the README screenshots
        run: bash .github/scripts/readme-images.sh readme-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-images
          path: readme-images/*.png
          if-no-files-found: error
          retention-days: 14

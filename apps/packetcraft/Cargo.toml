[package]
name = "packetcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "packetcraft"
description = "PacketCraft desktop app"

[lints]
workspace = true

[dependencies]
packetcraft-engine = { workspace = true }
packetcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

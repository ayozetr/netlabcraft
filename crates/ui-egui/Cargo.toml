[package]
name = "netlabcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NetLabCraft L6: the egui interface (topology canvas, device consoles, simulation event list)"

[lints]
workspace = true

[dependencies]
netlabcraft-core = { workspace = true }
netlabcraft-wire = { workspace = true }
netlabcraft-model = { workspace = true }
netlabcraft-sim = { workspace = true }
netlabcraft-ios = { workspace = true }
netlabcraft-engine = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# build.rs bakes contributors/contributors.json and people.toml into the About window.
[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NetLabCraft workspace tooling: cargo xtask ci | test | layers | assets | wasm | parity | version"

[lints]
workspace = true

[features]
# `cargo xtask parity` reads the command catalogs. Steps that only need the layer/asset checks
# can run with --no-default-features and skip compiling them.
default = ["engine"]
engine = ["dep:netlabcraft-engine", "dep:netlabcraft-ios"]

[dependencies]
serde_json = { workspace = true }
netlabcraft-engine = { workspace = true, optional = true }
netlabcraft-ios = { workspace = true, optional = true }
